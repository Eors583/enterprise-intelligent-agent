name: enterprise-agent-knowledge-dev

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${KNOWLEDGE_MINIO_ROOT_USER:-enterprise_knowledge}
      MINIO_ROOT_PASSWORD: ${KNOWLEDGE_MINIO_ROOT_PASSWORD:-local-knowledge-storage-only}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - knowledge-minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${KNOWLEDGE_MINIO_ROOT_USER:-enterprise_knowledge}
      MINIO_ROOT_PASSWORD: ${KNOWLEDGE_MINIO_ROOT_PASSWORD:-local-knowledge-storage-only}
      KNOWLEDGE_BUCKET: ${KNOWLEDGE_MINIO_BUCKET:-enterprise-knowledge}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set knowledge http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "knowledge/$${KNOWLEDGE_BUCKET}"
        mc anonymous set none "knowledge/$${KNOWLEDGE_BUCKET}"
    restart: 'no'

  qdrant:
    image: qdrant/qdrant:v1.18.2
    environment:
      QDRANT__SERVICE__API_KEY: ${KNOWLEDGE_QDRANT_API_KEY:-local-qdrant-knowledge-only}
      QDRANT__SERVICE__ENABLE_TLS: 'false'
    ports:
      - '127.0.0.1:6333:6333'
      - '127.0.0.1:6334:6334'
    volumes:
      - knowledge-qdrant-data:/qdrant/storage
    restart: unless-stopped

  docling:
    image: quay.io/docling-project/docling-serve:v1.21.0
    environment:
      DOCLING_SERVE_API_KEY: ${KNOWLEDGE_DOCLING_API_KEY:-local-docling-knowledge-only}
      DOCLING_SERVE_ENABLE_UI: '1'
      DOCLING_SERVE_MAX_SYNC_WAIT: '600'
    ports:
      - '127.0.0.1:5001:5001'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:5001/health'', timeout=5)"',
        ]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
    restart: unless-stopped

  tika:
    image: apache/tika:3.2.3.0-full
    ports:
      - '127.0.0.1:9998:9998'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9998/version >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable-debian
    environment:
      CLAMD_STARTUP_TIMEOUT: '900'
      FRESHCLAM_CHECKS: '12'
      # Keep the malware scanner aligned with the API/object-store infrastructure ceiling.
      CLAMD_CONF_StreamMaxLength: '2047M'
      CLAMD_CONF_MaxFileSize: '2047M'
      CLAMD_CONF_MaxScanSize: '2047M'
    ports:
      - '127.0.0.1:3310:3310'
    volumes:
      - knowledge-clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD', '/usr/local/bin/clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

volumes:
  knowledge-minio-data:
  knowledge-qdrant-data:
  knowledge-clamav-data:
