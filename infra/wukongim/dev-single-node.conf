WK_NODE_ID=1
WK_NODE_NAME=enterprise-im-node1
WK_NODE_DATA_DIR=/var/lib/wukongim
WK_CLUSTER_LISTEN_ADDR=0.0.0.0:7000
WK_CLUSTER_ADVERTISE_ADDR=wukongim:7000
WK_CLUSTER_HASH_SLOT_COUNT=64
WK_CLUSTER_HASH_SLOT_MIGRATION_ENABLED=false
WK_CLUSTER_INITIAL_SLOT_COUNT=16
WK_CLUSTER_CONTROLLER_REPLICA_N=1
WK_CLUSTER_SLOT_REPLICA_N=1
WK_CLUSTER_NODES=[{"id":1,"addr":"wukongim:7000"}]
WK_API_LISTEN_ADDR=0.0.0.0:5001
WK_EXTERNAL_WSADDR=ws://127.0.0.1:5520
# The audited 613fc2 revision rejects token auth until verifier hooks are wired.
# This acceptance-only node is loopback-bound by Compose; production must not
# use this configuration and the Nest API remains the authorization boundary.
WK_GATEWAY_TOKEN_AUTH_ON=false
WK_GATEWAY_LISTENERS=[{"name":"tcp-gateway","network":"tcp","address":"0.0.0.0:5100","transport":"gnet","protocol":"wkproto"},{"name":"ws-gateway","network":"websocket","address":"0.0.0.0:5200","transport":"gnet","protocol":"wsmux"}]
WK_MANAGER_LISTEN_ADDR=127.0.0.1:5301
WK_MANAGER_AUTH_ON=false
# Benchmark preparation routes are enabled only on this loopback-bound
# acceptance node. They must remain disabled on production nodes.
WK_BENCH_API_ENABLE=true
WK_BENCH_API_MAX_BATCH_SIZE=10000
WK_BENCH_API_MAX_PAYLOAD_BYTES=10485760
WK_METRICS_ENABLE=true
WK_LOG_LEVEL=info
WK_LOG_CONSOLE=true
