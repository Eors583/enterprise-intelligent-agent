# Production example only. Inject every ${env:...} value from the deployment secret/config
# plane and validate with `otelcol-contrib validate --config=<path>` before rollout.
extensions:
  health_check:
    endpoint: ${env:OTEL_COLLECTOR_HEALTH_ENDPOINT}
    path: /health/status
  bearertokenauth/ingest:
    scheme: Bearer
    filename: ${env:OTEL_COLLECTOR_INGEST_TOKEN_FILE}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:OTEL_COLLECTOR_OTLP_GRPC_ENDPOINT}
        max_recv_msg_size_mib: 16
        tls:
          cert_file: ${env:OTEL_COLLECTOR_TLS_CERT_FILE}
          key_file: ${env:OTEL_COLLECTOR_TLS_KEY_FILE}
        auth:
          authenticator: bearertokenauth/ingest
      http:
        endpoint: ${env:OTEL_COLLECTOR_OTLP_HTTP_ENDPOINT}
        max_request_body_size: 16777216
        tls:
          cert_file: ${env:OTEL_COLLECTOR_TLS_CERT_FILE}
          key_file: ${env:OTEL_COLLECTOR_TLS_KEY_FILE}
        auth:
          authenticator: bearertokenauth/ingest

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 1024
    spike_limit_mib: 256
  attributes/sanitize:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: db.statement
        action: delete
      - key: gen_ai.prompt
        action: delete
      - key: gen_ai.completion
        action: delete
  batch:
    send_batch_size: 2048
    send_batch_max_size: 4096
    timeout: 5s

exporters:
  prometheus:
    endpoint: ${env:OTEL_COLLECTOR_PROMETHEUS_ENDPOINT}
    enable_open_metrics: true
    metric_expiration: 10m
    translation_strategy: UnderscoreEscapingWithSuffixes
    resource_to_telemetry_conversion:
      enabled: true
  otlphttp/traces:
    endpoint: ${env:OTEL_TRACE_BACKEND_ENDPOINT}
    headers:
      authorization: ${env:OTEL_TRACE_BACKEND_AUTHORIZATION}
    tls:
      ca_file: ${env:OTEL_TRACE_BACKEND_CA_FILE}

service:
  extensions: [health_check, bearertokenauth/ingest]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/sanitize, batch]
      exporters: [otlphttp/traces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
  telemetry:
    logs:
      level: warn
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: ${env:OTEL_COLLECTOR_INTERNAL_METRICS_HOST}
                port: ${env:OTEL_COLLECTOR_INTERNAL_METRICS_PORT}
